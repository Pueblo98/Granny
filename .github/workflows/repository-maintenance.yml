name: Repository maintenance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  maintenance:
    name: Repository maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Match the repository's editorial calendar; future dates still fail.
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install documentation-check dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate canonical documents
        run: python scripts/validate-docs.py
      - name: Check dashboard freshness
        run: python scripts/cockpit.py --check
      - name: Test repository tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Require scoped handoff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_handoff.py --base "$BASE_SHA" --head HEAD
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
